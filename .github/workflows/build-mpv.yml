name: Build mpv (media-autobuild_suite)

on:
  push:
    branches: [ "deploy" ]
  pull_request:
    branches: [ "deploy" ]
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      timestamp: ${{ steps.run-script.outputs.timestamp }}
      artifact_name: mpv-x64-${{ steps.run-script.outputs.timestamp }}.7z

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare short workspace path
        shell: pwsh
        run: |
          if (Test-Path 'D:\mabs') {
            Remove-Item -Path 'D:\mabs' -Recurse -Force
          }
          New-Item -ItemType Directory -Path 'D:\mabs' | Out-Null
          Copy-Item -Path "$env:GITHUB_WORKSPACE\*" -Destination 'D:\mabs' -Recurse -Force

      - name: Cache build cache
        uses: actions/cache@v6
        with:
          path: D:\mabs\build\cache
          key: ${{ runner.os }}-mabs-mpv-cache-${{ hashFiles('build/**', 'media-autobuild_suite.bat') }}
          restore-keys: |
            ${{ runner.os }}-mabs-mpv-cache-

      - id: run-script
        name: Build mpv Windows x64 static
        shell: pwsh
        timeout-minutes: 240
        run: |
          $work   = 'D:\mabs'
          $outLog = Join-Path $work 'build\suite-out.log'
          $errLog = Join-Path $work 'build\suite-err.log'
          New-Item -Path (Split-Path $outLog) -ItemType Directory -Force | Out-Null
          if (Test-Path $outLog) { Remove-Item $outLog -Force }

          # Without this the suite can block forever on an interactive question
          # (e.g. media-suite_update.sh asking whether to remove extra packages).
          $env:MABS_NONINTERACTIVE = '1'
          $env:CI = 'true'

          Write-Host "Starting media-autobuild_suite.bat in $work (target: mpv, static)"
          $proc = Start-Process -FilePath 'cmd.exe' `
            -ArgumentList '/c', 'call', "$work\media-autobuild_suite.bat" `
            -WorkingDirectory $work -NoNewWindow -PassThru `
            -RedirectStandardOutput $outLog -RedirectStandardError $errLog

          # The suite writes its own progress into $outLog. Mirror every new byte into
          # the job log so the run is never a black box, and keep a watchdog on top:
          # 20 minutes without a single new byte means it is stuck (prompt/deadlock).
          $offset   = 0
          $stallSec = 0
          $tick     = 0
          while (-not $proc.HasExited) {
            Start-Sleep -Seconds 30
            $tick++
            $size = 0
            if (Test-Path $outLog) { $size = (Get-Item $outLog).Length }

            if ($size -gt $offset) {
              $stallSec = 0
              try {
                $fs = [System.IO.File]::Open($outLog, 'Open', 'Read', 'ReadWrite')
                try {
                  $fs.Position = $offset
                  $buf = New-Object byte[] ($fs.Length - $offset)
                  [void]$fs.Read($buf, 0, $buf.Length)
                  $offset = $fs.Position
                  foreach ($line in ([System.Text.Encoding]::UTF8.GetString($buf) -split "`r?`n")) {
                    if ($line.Trim()) { Write-Host $line }
                  }
                } finally { $fs.Dispose() }
              } catch { Write-Host "log read failed: $_" }
            } else {
              $stallSec += 30
            }

            if ($tick % 2 -eq 0) {
              $tail = ''
              try { $tail = ((Get-Content $outLog -Tail 1 -ErrorAction Stop) -join ' ') } catch { }
              Write-Host ("---- {0} size={1}KB stall={2}s last: {3}" -f (Get-Date -Format 'HH:mm:ss'), [math]::Round($size/1KB), $stallSec, $tail)
            }

            if ($tick % 10 -eq 0) {
              $pat = '^(pacman|bash|sh|make|ninja|cc1|cc1plus|ccache|git|git-remote-https|python|python3|curl|msys2|gcc)$'
              $snap = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match $pat }
              if ($snap) {
                foreach ($p in ($snap | Sort-Object WorkingSet64 -Descending | Select-Object -First 8)) {
                  $cpu = '-'
                  try { $cpu = [math]::Round($p.CPU, 1) } catch { }
                  Write-Host ("     proc {0} pid={1} cpu={2}s ram={3}MB" -f $p.ProcessName, $p.Id, $cpu, [math]::Round($p.WorkingSet64/1MB))
                }
              } else {
                Write-Host '     proc (no interesting child process found)'
              }
            }

            if ($stallSec -ge 1200) {
              Write-Host '::error::Builder produced no output for 20 minutes, killing it.'
              $proc.Kill()
              exit 1
            }
          }

          # Flush whatever the suite wrote after the last poll.
          if (Test-Path $outLog) {
            try {
              $fs = [System.IO.File]::Open($outLog, 'Open', 'Read', 'ReadWrite')
              try {
                if ($fs.Length -gt $offset) {
                  $fs.Position = $offset
                  $buf = New-Object byte[] ($fs.Length - $offset)
                  [void]$fs.Read($buf, 0, $buf.Length)
                  foreach ($line in ([System.Text.Encoding]::UTF8.GetString($buf) -split "`r?`n")) {
                    if ($line.Trim()) { Write-Host $line }
                  }
                }
              } finally { $fs.Dispose() }
            } catch { }
          }
          Write-Host "Builder exited with code $($proc.ExitCode)"

          # The suite uses the presence of build/logs.zip to indicate a failed build.
          $logs = Join-Path $work 'build\logs.zip'
          if (Test-Path $logs) {
            Write-Host "::error::Detected failure artifact: $logs"
            exit 1
          } else {
            Write-Host 'No logs.zip found; treating run as success.'
          }

          # Output timestamp for later steps
          $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'
          "timestamp=$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ASCII -Append
          exit 0

      - name: Upload builder log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: builder-log-${{ steps.run-script.outputs.timestamp || github.run_id }}
          path: D:\mabs\build\suite-out.log
          if-no-files-found: ignore
          archive: false

      - name: Upload error logs
        if: failure() && steps.run-script.conclusion == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: error-logs-${{ steps.run-script.outputs.timestamp || github.run_id }}
          path: D:\mabs\build\logs.zip
          if-no-files-found: warn
          archive: false

      - name: Smoke test mpv.exe
        shell: pwsh
        run: |
          $mpv = 'D:\mabs\local64\bin-video\mpv.exe'
          if (!(Test-Path $mpv)) { throw "Build finished but mpv.exe is missing: $mpv" }
          $proc = Start-Process -FilePath $mpv -ArgumentList '--no-config','--version' -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "mpv.exe --version exited with $($proc.ExitCode)" }
          Write-Host ("mpv.exe size: {0:N1} MB" -f ((Get-Item $mpv).Length / 1MB))

      - name: Export output file list CSV
        shell: pwsh
        run: |
          $report = 'D:\mabs\output.csv'
          $folders = @(
            'D:\mabs\local64\bin-video',
            'D:\mabs\local64\bin-audio',
            'D:\mabs\local64\bin-global'
          )

          $records = foreach ($folder in $folders) {
            if (Test-Path $folder) {
              Get-ChildItem -Path $folder -File -Recurse |
                Sort-Object FullName |
                ForEach-Object {
                  [pscustomobject]@{
                    Folder = ((Split-Path $folder -Leaf) + '\' + [System.IO.Path]::GetRelativePath($folder, $_.DirectoryName)).TrimEnd('\', '.')
                    FileName = $_.Name
                    SizeKB = [math]::Round($_.Length / 1KB)
                    WriteTimeUtc = $_.LastWriteTimeUtc.ToString('yyyy-MM-dd HH:mm:ss')
                  }
                }
            }
          }

          $records | Export-Csv -Path $report -NoTypeInformation -Encoding UTF8
          if (!(Test-Path $report)) { throw "Failed to create file list report: $report" }

      - name: Organize build artifacts
        shell: pwsh
        run: |
          $output = 'D:\mabs\artifacts'
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          # mpv player binaries
          $video = 'D:\mabs\local64\bin-video'
          foreach ($file in @('mpv.exe', 'mpv.com')) {
            $path = Join-Path $video $file
            if (Test-Path $path) {
              Copy-Item -Path $path -Destination $output -Force
            } else {
              Write-Host "Not found (skipped): $path"
            }
          }

          # Only present if FFmpeg was built shared; a static build ships a single mpv.exe.
          $dlls = Get-ChildItem -Path $video -Filter '*.dll' -File -ErrorAction SilentlyContinue
          foreach ($dll in $dlls) {
            Copy-Item -Path $dll.FullName -Destination $output -Force
          }

          # Manual, if the suite generated one
          $doc = 'D:\mabs\local64\share\doc\mpv'
          if (Test-Path $doc) {
            Copy-Item -Path $doc -Destination "$output\doc" -Recurse -Force
          }

          $archive = "D:\mabs\mpv-x64-${{ steps.run-script.outputs.timestamp }}.7z"
          Write-Host "Creating 7z archive: $archive"
          & 7z a -t7z $archive "$output\*" -mx=9 -mmt=on -mqs=on
          if (!(Test-Path $archive)) { throw "Failed to create archive: $archive" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mpv-x64-${{ steps.run-script.outputs.timestamp }}.7z
          path: D:\mabs\mpv-x64-${{ steps.run-script.outputs.timestamp }}.7z
          if-no-files-found: error
          archive: false

      - name: Upload bin folder file list
        uses: actions/upload-artifact@v7
        with:
          name: bin-folder-file-list-${{ steps.run-script.outputs.timestamp }}
          path: D:\mabs\output.csv
          if-no-files-found: error
          archive: false

  publish:
    name: Publish rolling release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-assets
          skip-decompress: true

      - name: Publish to rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: mpv-latest
          name: mpv autobuild - ${{ needs.build.outputs.timestamp }}
          body: |
            Automated rolling release of mpv for Windows x64 (static, single mpv.exe).

            Dependency set follows mpv-winbuild (HedioKojima, branch rm):
            dav1d, libjxl, lcms2, libass (freetype/harfbuzz/fribidi), libplacebo
            (vulkan-loader/shaderc/glslang/spirv-cross), luajit, libarchive, uchardet, zlib.

            - Action: ${{ github.run_number }}
            - Builder commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/${{ needs.build.outputs.artifact_name }}"
