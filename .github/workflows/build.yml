name: build mpv (MSYS2 clang64)

on:
  push:
    branches: [ "clang64" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish / update the rolling release"
        type: boolean
        default: false
      fullclean:
        description: "Delete every stamp file and rebuild all packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git
            curl
            jq
            patch
            make
            tar
            xz
            zstd
            diffutils
            findutils
            autoconf
            automake
            libtool
            gettext
            gettext-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-7zip
            mingw-w64-clang-x86_64-python-jinja
            mingw-w64-clang-x86_64-python-markupsafe

      - name: Toolchain info
        id: tool
        run: |
          echo "cc=$(clang --version | head -1 | tr -c 'A-Za-z0-9._-' '-')" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          key: clang64-src-${{ hashFiles('packages/*.cmake') }}-r${{ github.run_id }}
          restore-keys: |
            clang64-src-${{ hashFiles('packages/*.cmake') }}-
            clang64-src-

      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            !build/mpv
          key: clang64-build-${{ steps.tool.outputs.cc }}-${{ hashFiles('packages/*.cmake','CMakeLists.txt','toolchain.cmake.in','meson_native.ini.in','exec.in','cmake/*.cmake') }}
          restore-keys: |
            clang64-build-${{ steps.tool.outputs.cc }}-

      - name: Update sources
        id: src
        run: |
          changed=0
          for d in src_packages/*/; do
            [ -d "$d/.git" ] || continue
            name=$(basename "$d")
            old=$(git -C "$d" rev-parse HEAD)
            ref=$(git -C "$d" rev-parse --abbrev-ref HEAD)
            if [ "$ref" = "HEAD" ]; then
              # 浅克隆出来的 tag（比如 luajit v2.1），跟随同名的 tag
              tag=$(git -C "$d" describe --tags --exact-match 2>/dev/null || true)
              [ -n "$tag" ] || continue
              git -C "$d" fetch -q --depth 1 --force origin "refs/tags/$tag:refs/tags/$tag" || continue
              git -C "$d" reset -q --hard "refs/tags/$tag"
            else
              git -C "$d" fetch -q --depth 1 --force origin "$ref" || { echo "fetch failed: $name"; continue; }
              git -C "$d" reset -q --hard FETCH_HEAD
            fi
            new=$(git -C "$d" rev-parse HEAD)
            if [ "$old" != "$new" ]; then
              echo "::notice title=source updated::$name $old -> $new"
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            echo "上游有更新，丢弃 build 目录做一次干净的完整重建"
            rm -rf build
            echo "changed=true" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          else
            echo "所有源码都在最新，复用 build 缓存"
            echo "changed=false" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          fi

      - name: Configure
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMINGW_INSTALL_PREFIX="$(cygpath -m "$MINGW_PREFIX")" \
            -DSINGLE_SOURCE_LOCATION="$(cygpath -m "$PWD/src_packages")" \
            -DGCC_ARCH=x86-64-v3 \
            -DENABLE_CCACHE=ON

      - name: Download sources
        id: download
        run: |
          set -o pipefail
          total=$(grep -c "^    [a-z]" packages/CMakeLists.txt || true)
          : > dl.log
          timeout -k 10 1800 ninja -C build -k 0 -v download > dl.log 2>&1 &
          pid=$!
          start=$(date +%s)
          while kill -0 "$pid" 2>/dev/null; do
            repos=$(find src_packages -maxdepth 2 -name .git -type d 2>/dev/null | wc -l | tr -d ' ')
            size=$(du -sm src_packages 2>/dev/null | cut -f1)
            echo "---- $(date -u +%H:%M:%S) repos=${repos}/28 size=${size}MB elapsed=$(( ($(date +%s)-start)/60 ))min | $(tail -n 1 dl.log | tr -d '\r' | cut -c1-140)"
            sleep 30
          done
          wait "$pid"; rc=$?
          echo "==== download finished rc=$rc ===="
          grep -iE "FAILED|error|fatal|fails" dl.log | tail -n 40 || true
          tail -n 25 dl.log
          exit $rc

      - name: Save source cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: clang64-src-${{ hashFiles('packages/*.cmake') }}-r${{ github.run_id }}

      - name: Build mpv
        run: |
          if [ "${{ inputs.fullclean == true }}" = "true" ]; then
            ninja -C build mpv-fullclean
          fi
          ninja -C build mpv

      - name: Save build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            build
            !build/mpv
          key: clang64-build-${{ steps.tool.outputs.cc }}-${{ hashFiles('packages/*.cmake','CMakeLists.txt','toolchain.cmake.in','meson_native.ini.in','exec.in','cmake/*.cmake') }}

      - name: Smoke test
        run: |
          ./build/mpv/mpv.exe --no-config --version
      - name: Check static linking
        run: |
          echo "--- DLL imports of mpv.exe ---"
          llvm-objdump -p build/mpv/mpv.exe | awk '/DLL Name/ {print $3}' | sort -u
          # 只匹配我们自编库的 DLL 名（注意别写成 ^av/^sw，会把 AVRT.dll 之类的系统 DLL 误杀）
          bad=$(llvm-objdump -p build/mpv/mpv.exe | awk '/DLL Name/ {print $3}' \
                | grep -Ei '^(libplacebo|spirv-cross|shaderc|libass|ass-[0-9]|avcodec|avformat|avutil|avfilter|swscale|swresample|postproc|luajit|zlib|libz|libunibreak|harfbuzz|freetype|fribidi|uchardet|archive|brotli|libzstd|zstd|xxhash|lcms|dav1d|glslang)' || true)
          if [ -n "$bad" ]; then
            echo "::error::mpv.exe 依赖了非系统 DLL，说明有库被动态链接："
            echo "$bad"
            exit 1
          fi
          echo "OK: 只依赖系统 DLL"

      - name: Package
        run: |
          mkdir -p release/mpv
          cp build/mpv/mpv.exe release/mpv/
          ls -lh release/mpv/mpv.exe
          stamp=$(date -u +%Y%m%d_%H%M)
          cd release
          # -mx=7 和 -mx=9 对 exe 的体积差别很小，但快很多；-mmt=on 吃满核心
          7z a -m0=lzma2 -mx=7 -mmt=on "mpv-x64-clang64-${stamp}.7z" mpv
          echo "MPV_ARCHIVE=$(ls mpv-x64-clang64-*.7z)" >> "$(cygpath -u "$GITHUB_ENV")"
          ls -lh

      - name: Collect build logs
        if: failure()
        run: |
          find build -type f -name "*.log" -print > logs.txt || true
          tar -czf logs.tar.gz -T logs.txt 2>/dev/null || true
          ls -l logs.tar.gz || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs.tar.gz
          if-no-files-found: ignore

      - name: Upload mpv
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MPV_ARCHIVE }}
          path: release/${{ env.MPV_ARCHIVE }}
          if-no-files-found: error

      - name: Publish rolling release
        if: ${{ inputs.release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mpv-win-clang64 --cleanup-tag --yes 2>$null
          $notes = "Automated build of mpv.exe (static, MSYS2 clang64).`n`n- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $notes | Out-File -Encoding utf8 notes.md
          gh release create mpv-win-clang64 --title "mpv (clang64)" --notes-file notes.md "release/${{ env.MPV_ARCHIVE }}"
