name: build mpv (MSYS2 clang64)

on:
  push:
    branches: [ "clang64" ]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish / update the rolling release"
        type: boolean
        default: false
      fullclean:
        description: "Delete every stamp file and rebuild all packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: msys2 {0}
    steps:

      - uses: actions/checkout@v4

      - name: Setup MSYS2 (clang64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git
            curl
            patch
            make
            tar
            xz
            zstd
            diffutils
            findutils
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-nasm
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-7zip
            mingw-w64-clang-x86_64-python-jinja
            mingw-w64-clang-x86_64-python-markupsafe

      - name: Toolchain info
        id: tool
        run: |
          echo "cc=$(clang --version | head -1 | tr -c 'A-Za-z0-9._-' '-')" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Restore source cache
        id: srccache
        uses: actions/cache/restore@v4
        with:
          path: src_packages
          # 主 key 故意写成不存在的名字：源码快照是滚动更新的（key 带 rev），
          # 必须让 restore-keys 去挑"最新那份"。如果这里写一个会命中的主 key，
          # GitHub 会直接用那份旧快照，永远走不到 restore-keys。
          key: clang64-src-latest
          restore-keys: |
            clang64-src-

      - name: Source revision
        id: rev0
        # build 缓存 key 必须绑定源码状态，否则源码更新后的产物会写回旧 key，
        # 下一次又把旧构建目录复活。这里先把当前 src_packages 的 HEAD 拼成指纹。
        run: |
          if [ -z "$(find src_packages -maxdepth 2 -name .git -type d -print -quit 2>/dev/null)" ]; then
            echo "rev=cold" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          else
            rev=$(find src_packages -maxdepth 2 -name .git -type d 2>/dev/null \
                  | while read -r g; do git -C "$(dirname "$g")" rev-parse HEAD; done \
                  | sort | sha256sum | cut -c1-12)
            echo "rev=$rev" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          fi

      - name: Restore build cache
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: |
            build
            !build/mpv
          key: clang64-build-${{ steps.tool.outputs.cc }}-${{ hashFiles('packages/*.cmake','CMakeLists.txt','toolchain.cmake.in','meson_native.ini.in','exec.in','cmake/*.cmake') }}-${{ steps.rev0.outputs.rev }}
          restore-keys: |
            clang64-build-${{ steps.tool.outputs.cc }}-

      - name: Update sources
        id: src
        env:
          REV0: ${{ steps.rev0.outputs.rev }}
        run: |
          # 1) 从包定义生成 pkg -> deps 表（依赖块格式统一：DEPENDS 之后每行一个包名），
          #    只保留 packages/CMakeLists.txt 里真正启用的包（curl 等保留但不参与构建）
          enabled=$(awk '
            /^list\(APPEND ep/ { f = 1; next }
            f && /^\)/ { f = 0 }
            f && /^    [a-z0-9_-]+$/ { print $1 }
          ' packages/CMakeLists.txt)
          [ -n "$enabled" ] || { echo "::error::无法解析启用包列表"; exit 1; }

          awk '
            FNR == 1 { in_deps = 0 }
            /^ExternalProject_Add\(/ {
              name = $0; sub(/^ExternalProject_Add\(/, "", name); sub(/[ \t].*/, "", name)
              in_deps = 0; next
            }
            /^    DEPENDS$/ { in_deps = 1; next }
            in_deps && /^        / {
              line = $0; sub(/#.*/, "", line); gsub(/[ \t]/, "", line)
              if (line != "") print name, line
              next
            }
            in_deps && !/^        / { in_deps = 0 }
          ' packages/*.cmake \
            | awk -v list="$enabled" 'BEGIN { n = split(list, a, " "); for (i = 1; i <= n; i++) ok[a[i]] = 1 } ok[$1] { print }' \
            > /tmp/package-deps.txt
          if [ ! -s /tmp/package-deps.txt ]; then
            echo "::error::无法解析 packages/*.cmake 的 DEPENDS，中止"; exit 1
          fi

          # 2) 每个 git 源码 fetch + reset 到远端，记录变化的包
          changed=0
          changed_pkgs=""
          heads=""
          for d in src_packages/*/; do
            [ -d "$d/.git" ] || continue
            name=$(basename "$d")
            old=$(git -C "$d" rev-parse HEAD)
            ref=$(git -C "$d" rev-parse --abbrev-ref HEAD)
            if [ "$ref" = "HEAD" ]; then
              # tag 浅克隆（比如 luajit v2.1）：跟随同名 tag
              tag=$(git -C "$d" describe --tags --exact-match 2>/dev/null || true)
              [ -n "$tag" ] || { heads="$heads$old"; continue; }
              git -C "$d" fetch -q --depth 1 --force origin "refs/tags/$tag:refs/tags/$tag" || { echo "fetch failed: $name"; heads="$heads$old"; continue; }
              git -C "$d" reset -q --hard "refs/tags/$tag" || continue
            else
              git -C "$d" fetch -q --depth 1 --force origin "$ref" || { echo "fetch failed: $name"; heads="$heads$old"; continue; }
              git -C "$d" reset -q --hard FETCH_HEAD || continue
            fi
            new=$(git -C "$d" rev-parse HEAD)
            heads="$heads$new"
            if [ "$old" != "$new" ]; then
              echo "::notice title=source updated::$name ${old:0:8} -> ${new:0:8}"
              changed=1
              changed_pkgs="$changed_pkgs $name"
            fi
          done
          rev=$(printf '%s' "$heads" | sha256sum | cut -c1-12)

          # 3) 变更包 + 所有下游依赖者（含 mpv）：只重建这一小撮，而不是整个 build
          declare -A deps
          while read -r p q; do deps[$p]="${deps[$p]} $q"; done < /tmp/package-deps.txt
          set_pkgs="$changed_pkgs"
          if [ "$changed" = "1" ]; then
            while :; do
              added=""
              for p in "${!deps[@]}"; do
                case " $set_pkgs " in *" $p "*) continue ;; esac
                for q in ${deps[$p]}; do
                  case " $set_pkgs " in *" $q "*) added="$added $p"; break ;; esac
                done
              done
              [ -z "$added" ] && break
              set_pkgs="$set_pkgs $added"
            done
          fi
          set_pkgs=$(echo $set_pkgs | tr ' ' '\n' | sort -u | tr '\n' ' ')

          # 4) 源码缓存没命中：刚恢复的 build 属于未知源码状态，直接丢掉
          if [ "$REV0" = "cold" ] || [ -z "$REV0" ]; then
            if [ -d build ]; then
              echo "源码缓存未命中，丢弃恢复出来的旧 build 目录"
              rm -rf build
            fi
            changed=1
          fi

          # 安装前缀在 build/prefix（跟着缓存走）。它不存在说明缓存里没有安装产物
          # （首次切到这里、或缓存不完整）：stamp 与产物已经对不上，逐包补救只会踩
          # BUILD_IN_SOURCE 包（产物在源码目录里、不随缓存走）这类坑，直接丢 build
          # 做一次完整构建最省心。源码目录保留，download 步会跳过重新克隆。
          if [ ! -d build/prefix/lib/pkgconfig ]; then
            echo "安装前缀为空，丢弃 build 目录做一次完整构建"
            rm -rf build
          fi

          echo "changed=$changed" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          echo "pkgs=$set_pkgs" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          echo "rev=$rev" >> "$(cygpath -u "$GITHUB_OUTPUT")"
          echo "本轮变更包：${set_pkgs:-无}"

      - name: Configure
        run: |
          # 其余参数走 CMakeLists.txt 的默认值（GCC_ARCH=x86-64-v3 等），只在这里指定
          # 必须由环境提供的东西，避免同一个值在 workflow 和 CMake 里各写一份。
          # 构建配置指纹：packages/*.cmake、工具链、meson native 文件变了，缓存里恢复
          # 出来的 stamp 仍然存在，新参数不会生效。这里发现指纹不一致就直接丢 build。
          # 末尾的 fp-v1 是常量盐：以后要强制让大家重编时，改一下它就行。
          cfg_hash=$( { cat CMakeLists.txt packages/*.cmake toolchain.cmake.in \
            meson_native.ini.in exec.in cmake/*.cmake; echo fp-v2; } | sha256sum | cut -c1-16)
          if [ -d build ]; then
            if [ ! -f build/.config-hash ]; then
              echo "build 里没有配置指纹（旧缓存），丢弃 build 目录"
              rm -rf build
            elif [ "$(cat build/.config-hash)" != "$cfg_hash" ]; then
              echo "构建配置变化（$(cat build/.config-hash) -> $cfg_hash），丢弃 build 目录"
              rm -rf build
            fi
          fi
          mkdir -p build
          echo "$cfg_hash" > build/.config-hash

          cmake -G Ninja -B build -S . \
            -DSINGLE_SOURCE_LOCATION="$(cygpath -m "$PWD/src_packages")" \
            -DENABLE_CCACHE=ON

      - name: Download sources
        id: download
        run: |
          set -o pipefail
          : > dl.log
          timeout -k 10 1800 ninja -C build -k 0 download > dl.log 2>&1 &
          pid=$!
          start=$(date +%s)
          while kill -0 "$pid" 2>/dev/null; do
            repos=$(find src_packages -maxdepth 2 -name .git -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "---- $(date -u +%H:%M:%S) repos=${repos} elapsed=$(( ($(date +%s)-start)/60 ))min | $(tail -n 1 dl.log | tr -d '\r' | cut -c1-120)"
            sleep 30
          done
          wait "$pid"; rc=$?
          echo "==== download finished rc=$rc ===="
          if [ "$rc" != "0" ]; then
            grep -iE "FAILED|error|fatal|fails" dl.log | tail -n 40 || true
            tail -n 25 dl.log
          fi
          exit $rc

      - name: Save source cache
        # 每次 run 都把源码树按"当前版本"存一份（key 里带 rev）：
        #   - 版本没动时 key 已存在，cache/save 直接跳过，不产生上传；
        #   - 版本动了才写新 entry（约 650MB），旧 entry 由 GitHub 按 LRU 淘汰。
        # 这样下一次 run 恢复出来的源码就是"上次构建完的状态"，rev0 与 build 缓存的
        # key 对得上，缓存命中即增量；否则源码永远退回旧快照，每隔一次就把同一批
        # 包重新 fetch + 重编一遍。
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src_packages
          key: clang64-src-${{ hashFiles('packages/*.cmake') }}-${{ steps.src.outputs.rev }}

      - name: Build mpv
        env:
          PKGS: ${{ steps.src.outputs.pkgs }}
        run: |
          if [ "${{ inputs.fullclean == true }}" = "true" ]; then
            echo "fullclean：清掉所有包的 stamp（含 download），从头编译"
            ninja -C build package-fullclean
          fi
          # build/mpv 不进缓存（体积大），所以复制步骤每次都要重跑一遍，几秒钟
          rm -f build/packages/mpv-prefix/src/mpv-stamp/mpv-copy-binary

          # 只清掉"变更包 + 下游"的 stamp，构建目录保留：
          # 目录留着 meson/cmake 会就地增量重配，删掉反而会让 configure 步 cd 失败；
          # mkdir stamp 一起删，目录万一不存在也能被重新建出来。
          for p in $PKGS; do
            echo "清理受影响包: $p"
            for s in mkdir configure build install copy-binary force-meson-configure; do
              rm -f "build/packages/$p-prefix/src/$p-stamp/$p-$s"
            done
          done
          ninja -C build mpv

          # 去掉符号表再跑 smoke / 打包：meson 的 strip 只在 install 阶段生效，
          # 而 mpv 的 INSTALL_COMMAND 是空的，不手动 strip 就会把符号带进发布包。
          llvm-strip --strip-all build/mpv/mpv.exe
          ls -l build/mpv/mpv.exe

      - name: Save build cache
        # 源码变了（rev 变化）就存一份新 key；命中原 key 时无需重复上传
        if: success() && steps.buildcache.outputs.cache-hit != 'true' || success() && steps.src.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build
            !build/mpv
          key: clang64-build-${{ steps.tool.outputs.cc }}-${{ hashFiles('packages/*.cmake','CMakeLists.txt','toolchain.cmake.in','meson_native.ini.in','exec.in','cmake/*.cmake') }}-${{ steps.src.outputs.rev }}

      - name: Smoke test
        run: |
          ./build/mpv/mpv.exe --no-config --version
          # 端到端解码：demux -> decode -> filter -> VO(null)，比 --version 更能验证
          # 编译参数（-O3/-march/LTO）没有把功能编坏
          ./build/mpv/mpv.exe --no-config --vo=null --ao=null --frames=1 --really-quiet test/smoke.png

      - name: Check static linking
        run: |
          echo "--- DLL imports of mpv.exe ---"
          imports=$(llvm-objdump -p build/mpv/mpv.exe | awk '/DLL Name/ {print $3}' | sort -u)
          echo "$imports"
          # 白名单：只允许 Windows 自带 DLL（含 UCRT 的 api-ms-win-* 转发 DLL）。
          # 比黑名单更严格：任何我们自己编的库、或意外带进来的第三方 DLL 都会被抓到。
          allow='^(ADVAPI32|AVRT|bcrypt|CRYPT32|d3d11|d3dcompiler_47|DXVA2|dwmapi|dxgi|GDI32|IMM32|IPHLPAPI|KERNEL32|MF|MFPlat|MFReadWrite|ncrypt|ole32|Secur32|SHCORE|SHELL32|SHLWAPI|USER32|UxTheme|VERSION|WINMM|WLDAP32|WS2_32|api-ms-win-[a-z0-9-]+|ext-ms-[a-z0-9-]+)\.dll$'
          bad=$(echo "$imports" | grep -Eiv "$allow" || true)
          if [ -n "$bad" ]; then
            echo "::error::mpv.exe 导入了非系统 DLL（说明有库被动态链接）："
            echo "$bad"
            exit 1
          fi
          echo "OK: 只依赖系统 DLL"

      - name: Package
        run: |
          mkdir -p release/mpv
          cp build/mpv/mpv.exe release/mpv/
          ls -lh release/mpv/mpv.exe
          stamp=$(date -u +%Y%m%d_%H%M)
          cd release
          # -mx=7 和 -mx=9 对 exe 的体积差别很小，但快很多；-mmt=on 吃满核心
          7z a -m0=lzma2 -mx=7 -mmt=on "mpv-x64-clang64-${stamp}.7z" mpv
          echo "MPV_ARCHIVE=$(ls mpv-x64-clang64-*.7z)" >> "$(cygpath -u "$GITHUB_ENV")"
          ls -lh

      - name: Collect build logs
        if: failure()
        run: |
          find build -type f -name "*.log" -print > logs.txt || true
          tar -czf logs.tar.gz -T logs.txt 2>/dev/null || true
          ls -l logs.tar.gz || true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs.tar.gz
          if-no-files-found: ignore

      - name: Upload mpv
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MPV_ARCHIVE }}
          path: release/${{ env.MPV_ARCHIVE }}
          if-no-files-found: error

      - name: Publish rolling release
        if: ${{ inputs.release == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mpv-win-clang64 --cleanup-tag --yes 2>$null
          $notes = "Automated build of mpv.exe (static, MSYS2 clang64).`n`n- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $notes | Out-File -Encoding utf8 notes.md
          gh release create mpv-win-clang64 --title "mpv (clang64)" --notes-file notes.md "release/${{ env.MPV_ARCHIVE }}"
